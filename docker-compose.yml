services:
  blunder-tutor:
    build:
      context: .
    container_name: blunder-tutor-local
    user: "1000:1000"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LICHESS_USERNAME=${LICHESS_USERNAME:-}
      - CHESSCOM_USERNAME=${CHESSCOM_USERNAME:-}
      - STOCKFISH_BINARY=/usr/local/bin/stockfish
      - STOCKFISH_DEPTH=${STOCKFISH_DEPTH:-13}
      - STOCKFISH_TIME=${STOCKFISH_TIME:-5}
      - ENGINE_POOL_SIZE=${ENGINE_POOL_SIZE:-2}
      - STOCKFISH_HASH_MB=${STOCKFISH_HASH_MB:-96}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - CACHE_DEFAULT_TTL=${CACHE_DEFAULT_TTL:-240}
      - EXPLANATION_LLM_ENABLED=${EXPLANATION_LLM_ENABLED:-true}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-llama-3.1-8b-instant}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-30}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434/api/generate}
      - HOST=0.0.0.0
      - PORT=8000
    mem_limit: 1600m
    mem_reservation: 1100m
    cpus: 2.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
